   <g id="text_1">
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(70.479422 92.074586)">ประชากรและสุขภาพ</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(52.059656 103.009586)">Hamilton–Perry 77 จังหวัด</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(53.398406 115.843024)">ทะเบียนสิทธิ ความชุกที่บันทึก</text>
   </g>
   <g id="text_2">
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(83.168719 211.201119)">การเข้า–ออก</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(42.776297 222.361119)">การลาออก เกษียณ ฯลฯ (hazard)</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(51.796687 233.439557)">การกลับเข้า; ไม่รวมการรับใหม่</text>
   </g>
   <g id="text_3">
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(66.573562 328.483356)">เป้าหมายและกฎปฏิบัติ</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(49.756219 341.586793)">1:1,000 (ตัวอย่าง) ขั้นต่ำ 1 คน</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(57.308484 352.575231)">เพดาน 10% โยกย้าย ≤2%</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(340.921125 91.862242)">ตัวหารสามแบบ</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(312.391828 104.903805)">P ประชากร · S บริการที่เกิดขึ้น</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(306.904641 116.190367)">N-STD M5 ตรึงทรัพยากรอ้างอิง</text>
   </g>
   <g id="text_5">
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(314.694562 223.254025)">จัดสรรแบบมีข้อจำกัด (MILP)</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(296.956828 234.872463)">รับใหม่ x และโยกย้าย z เป็นจำนวนเต็ม</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(276.291984 245.8609)">lexicographic: ขาดแคลน → กระจาย → โยกย้าย</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(308.753156 257.3359)">stock–flow เดียวกับการจำลอง</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(597.038766 93.946305)">บริการที่ตอบสนองทรัพยากร</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(593.393766 105.232867)">M5 (ค่าบวก) ยึดกับฐานบริการ</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(625.634859 116.121461)">λ = 0, 0.5, 1</text>
   </g>
   <g id="text_7">
