    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(572.432203 233.859963)">ทุกตัวหาร: ความเพียงพอ ความขาดแคลน</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(612.113062 244.776681)">Gini/Theil ภาระงาน</text>
    <text style="font-size: 9px; font-family: 'Prompt', 'DejaVu Sans'" transform="translate(583.057125 257.610119)">การเปลี่ยนปลายทาง ความไม่แน่นอน</text>
