<!DOCTYPE html>
<html lang="th" data-lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>แผนที่กำลังคนด้านสุขภาพ | Thailand HRH Dashboard</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
<script src="i18n.js"></script>
</head>
<body>

<div id="map"></div>

<div class="left-stack">
  <header class="panel panel-header">
    <div class="header-row">
      <div class="logo-row">
        <img class="logo-img" src="logos/rama.png" alt="Faculty of Medicine Ramathibodi Hospital, Mahidol University" />
        <img class="logo-img" src="logos/rama-hsr-web.png" alt="Health Policy and Systems Research Team" />
        <img class="logo-img" src="logos/hsri.png" alt="Health Systems Research Institute" />
      </div>
      <div class="header-actions">
        <button id="lang-toggle" class="icon-btn lang-btn" data-i18n-title="lang.toggleTitle" title="สลับภาษา">
          <span class="lang-label">EN</span>
        </button>
        <button id="theme-toggle" class="icon-btn" data-i18n-title="theme.toggleTitle" title="สลับธีม">
          <span class="theme-icon" id="theme-icon">&#9728;&#65039;</span>
        </button>
      </div>
    </div>
    <h1 data-i18n="site.title">โครงการกำลังคนด้านสุขภาพประเทศไทย</h1>
    <p class="subtitle" data-i18n-html="site.subtitle">ความหนาแน่นและความเป็นธรรมของการกระจาย<br>พ.ศ. 2558&ndash;2567</p>
    <a class="report-cta" href="report.html">
      <span data-i18n="nav.report">รายงาน</span>
      <span aria-hidden="true">&rarr;</span>
    </a>
  </header>

  <section class="panel panel-scatter" id="scatter-panel">
    <div class="scatter-title" id="scatter-title" data-i18n="scatter.title">ความหนาแน่นเทียบความเป็นธรรม ทุกวิชาชีพ</div>
    <svg id="scatter-svg" viewBox="0 0 252 190"></svg>
    <div class="scatter-legend" id="scatter-legend"></div>
  </section>

  <section class="panel panel-legend" id="legend-panel">
    <div class="legend-title" id="legend-title" data-i18n="legend.density">ความหนาแน่นต่อประชากรแสนคน</div>
    <div class="legend-bar" id="legend-bar"></div>
    <div class="legend-labels">
      <span id="legend-min">0</span>
      <span id="legend-mid"></span>
      <span id="legend-max">0</span>
    </div>
  </section>
</div>

<section class="panel panel-controls">
  <div class="field">
    <span class="field-label" data-i18n="field.level">ระดับพื้นที่</span>
    <div class="segmented" id="level-toggle">
      <button class="segmented-btn is-active" data-level="hregion" data-i18n="level.hregion">เขตสุขภาพ</button>
      <button class="segmented-btn" data-level="prov" data-i18n="level.prov">จังหวัด</button>
    </div>
  </div>

  <label class="field">
    <span class="field-label" data-i18n="field.hrh">วิชาชีพ</span>
    <select id="hrh-select"></select>
  </label>

  <div class="field">
    <span class="field-label" data-i18n="field.view">มุมมอง</span>
    <div class="segmented" id="mode-toggle">
      <button class="segmented-btn is-active" data-mode="snapshot" data-i18n="mode.snapshot">รายปี</button>
      <button class="segmented-btn" data-mode="change" data-i18n="mode.change">การเปลี่ยนแปลง 10 ปี</button>
    </div>
  </div>

  <label class="field" id="year-field">
    <span class="field-label"><span data-i18n="field.year">ปี พ.ศ.</span> <strong id="year-value">2567</strong></span>
    <input type="range" id="year-slider" min="0" max="9" step="1" value="9" />
  </label>
</section>

<aside class="panel panel-stats">
  <div class="stat-tile" id="stat-density">
    <div class="stat-label" id="stat-density-label">&mdash;</div>
    <div class="stat-value-row">
      <span class="stat-value" id="stat-density-value">&mdash;</span>
      <span class="stat-delta" id="stat-density-delta"></span>
    </div>
    <svg class="sparkline" id="spark-density" viewBox="0 0 240 48" preserveAspectRatio="none"></svg>
  </div>
  <div class="stat-tile" id="stat-gini">
    <div class="stat-label" id="stat-gini-label" data-i18n="stat.giniLabel">สัมประสิทธิ์จีนี</div>
    <div class="stat-value-row">
      <span class="stat-value" id="stat-gini-value">&mdash;</span>
      <span class="stat-delta" id="stat-gini-delta"></span>
    </div>
    <svg class="sparkline" id="spark-gini" viewBox="0 0 240 48" preserveAspectRatio="none"></svg>
  </div>
</aside>

<footer class="panel panel-source" data-i18n="source">
  ข้อมูล: GIS Health Map (gishealth.moph.go.th) &middot; สำนักบริหารการทะเบียน กรมการปกครอง
</footer>

<div class="map-tooltip" id="map-tooltip"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
